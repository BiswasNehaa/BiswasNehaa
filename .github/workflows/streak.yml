name: Update Streak Stats
on:
  schedule:
    - cron: "0 3 * * *" # Runs every day automatically
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to run it manually anytime
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=BiswasNehaa&theme=tokyonight&hide_border=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update streak stats" || exit 0
          git push
